server {
 listen 80;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /graphql { proxy_pass http://host.docker.internal:8005/graphql; }
 location /station/ { proxy_pass http://host.docker.internal:8001/; }
 location /billing/ { proxy_pass http://host.docker.internal:8002/; }
 location /dispatch/ { proxy_pass http://host.docker.internal:8003/; }
 location /saga/ { proxy_pass http://host.docker.internal:8004/; }
 location /gateway/ { proxy_pass http://host.docker.internal:8005/; }
}
