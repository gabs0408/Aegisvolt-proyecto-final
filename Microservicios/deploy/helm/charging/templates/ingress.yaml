apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: charging-graphql
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," (required "ingress.allowedCidrs must contain trusted client CIDRs" .Values.ingress.allowedCidrs) | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '{{ if .Values.ingress.certificateArn }}[{"HTTP":80},{"HTTPS":443}]{{ else }}[{"HTTP":80}]{{ end }}'
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    alb.ingress.kubernetes.io/actions.charging-traffic: >-
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"charging-graphql-gateway-stable","servicePort":"http","weight":{{ .Values.stableWeight }}},{"serviceName":"charging-graphql-gateway-canary","servicePort":"http","weight":{{ .Values.canaryWeight }}}],"targetGroupStickinessConfig":{"enabled":false}}}
spec:
  rules:
    {{- if .Values.ingress.hostname }}
    - host: {{ required "ingress.hostname must be a DNS name covered by the ACM certificate" .Values.ingress.hostname | quote }}
    {{- else }}
    - 
    {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: charging-traffic
                port:
                  name: use-annotation
