apiVersion: batch/v1
kind: CronJob
metadata:
  name: charging-saga-auditor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: charging
    app.kubernetes.io/component: saga-auditor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: charging
            app.kubernetes.io/component: saga-auditor
        spec:
          restartPolicy: Never
          serviceAccountName: saga-auditor
          containers:
            - name: saga-auditor
              image: {{ printf "%s/%s:%s" .Values.imageRegistry .Values.images.sagaAuditor .Values.canaryTag | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: SERVICE_NAME
                  value: saga-auditor
                - name: ENVIRONMENT
                  value: {{ trimPrefix "charging-" .Release.Namespace | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.awsRegion | quote }}
                - name: SAGA_TABLE_NAME
                  value: {{ printf "%s-sagas" .Release.Namespace | quote }}
                - name: SAGA_STALE_AFTER_SECONDS
                  value: "600"
                - name: PREFECT_LOGGING_LEVEL
                  value: ERROR
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
