apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-reservation-service
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "stationReservationRoleArn must be configured" .Values.stationReservationRoleArn | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saga-orchestrator-service
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "sagaOrchestratorRoleArn must be configured" .Values.sagaOrchestratorRoleArn | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saga-auditor
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "sagaAuditorRoleArn must be configured" .Values.sagaAuditorRoleArn | quote }}
